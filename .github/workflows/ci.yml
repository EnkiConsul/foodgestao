name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck (strict — no errors allowed)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: ESLint (strict — no warnings allowed)
        run: npx eslint . --max-warnings=0

      - name: Production build
        env:
          # Skip the prebuild security-lint hook here; that runs in its own workflow.
          SKIP_SECURITY_LINT: "1"
        run: npx vite build
