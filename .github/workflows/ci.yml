name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — nenhum segredo não-VITE_ no .env versionado
        # Falha se alguém commitar chave sem prefixo VITE_ no .env
        # (ex.: ASAAS_API_KEY, PLUGGY_CLIENT_SECRET). Roda antes do
        # npm ci para dar feedback em segundos.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            offenders=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env | grep -Ev '^VITE_' || true)
            if [ -n "$offenders" ]; then
              echo "::error::Variável não-VITE_ detectada no .env versionado:"
              echo "$offenders" | sed 's/=.*/=***/'
              exit 1
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck (strict — no errors allowed)
        run: npx tsc -p tsconfig.strict.json --noEmit

      - name: ESLint (ceiling — must not increase)
        # Ratchet decrescente. Baseline: 546 warnings (jul/2026), 0 errors.
        # Baixe este teto ao mesmo tempo em que reduz warnings; nunca aumente.
        run: npx eslint . --max-warnings=546

      - name: Production build
        # Invoke vite directly to skip the `prebuild` security-lint hook —
        # that check has its own dedicated workflow (security-lint.yml).
        run: npx vite build
