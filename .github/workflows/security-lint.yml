name: Security Lint

# Auditoria de catálogo do banco (exige PostgreSQL de homologação).
# Saiu de pull_request/push: o CI comum não depende de credencial privilegiada.
# Execução: manual (workflow_dispatch) quando existir mecanismo autorizado de
# acesso à homologação, e obrigatoriamente pelo Release Gate (job "security").
# Em modo --require, ausência de conexão = NÃO EXECUTADO = falha (exit 3).
on:
  workflow_dispatch:

jobs:
  security-lint:
    name: Supabase security findings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::NÃO EXECUTADO — SUPABASE_DB_URL (homologação) ausente."
            exit 1
          fi

      - name: Run security linter (CI strict)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-lint.mjs --ci --strict --require
